[package]
name = "ses-pdf"
version = "0.1.0"
edition = "2024"
# typst 0.15 requires Rust 1.92
rust-version = "1.92"
license = "MIT"
description = "Professional PDF report engine for structural engineering calculations — equations, tables, charts, and cover pages via Typst."
readme = "README.md"
repository = "https://github.com/FILL_IN/ses-pdf"
keywords = ["pdf", "engineering", "report", "typst", "chart"]
categories = ["rendering", "visualization"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }

# Typst document compilation engine (same ecosystem; interoperable)
typst = "0.15"
typst-pdf = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
typst-layout = "0.15"

# Chart rendering to SVG
plotters = { version = "0.3", default-features = false, features = [
    "svg_backend",
    "line_series",
    "point_series",
    "area_series",
    "histogram",
    "full_palette",
] }
plotters-svg = "0.3"
